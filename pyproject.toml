[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-probability"
version = "3.0.0"
description = "A comprehensive cryptocurrency trading analysis system using Machine Learning, Deep Learning, and Quantitative Strategies"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "Crypto Probability Team"}
]
dependencies = [
    # Core dependencies
    "ccxt[pro]>=4.2.0,<5.0.0",
    "pandas>=2.3.2",
    "numpy>=2.2.6",
    "pandas-ta>=0.4.0",
    "scikit-learn>=1.5.0",
    "statsmodels>=0.14.0,<0.15.0",
    "pykalman>=0.9.5,<0.10.0",
    "colorama>=0.4.6,<0.5.0",
    "imbalanced-learn>=0.12.3",
    "hmmlearn>=0.3.0,<0.4.0",
    "mlxtend>=0.23.0,<0.24.0",
    "numba>=0.60.0",
    "matplotlib>=3.7.0",
    "mplfinance>=0.12.10b0,<0.13.0",
    # Machine Learning dependencies
    "xgboost>=2.0.0,<2.1.0",
    # Deep Learning dependencies (required for deeplearning module)
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "torchaudio>=2.2.0",
    "pytorch-lightning>=2.2.0",
    "pytorch-forecasting>=1.0.0,<1.1.0",
    "tensorboard>=2.15.0,<2.16.0",
    "optuna>=3.5.0,<3.6.0",
    "maturin>=1.11.5",
    "blosc>=1.11.0,<2.0.0",
    "psutil>=5.9.0,<6.0.0",
    "google-genai>=0.3.0,<0.4.0",
    "pillow>=10.0.0,<11.0.0",
    "markdown>=3.5.0,<4.0.0",
    "fastapi>=0.104.0,<1.0.0",
    "uvicorn[standard]>=0.24.0,<1.0.0",
    "python-multipart>=0.0.6,<1.0.0",
    "redis>=5.0.0,<6.0.0",
    "websocket-client>=1.6.0,<2.0.0",
    "requests>=2.31.0,<3.0.0",
    "tradingview-scraper>=0.4.0",
    "customtkinter>=5.0.0,<6.0.0",
    "plyer>=2.1.0,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "joblib>=1.3.0,<2.0.0",
    "msgpack>=1.1.2",
    "polars>=0.20.0,<1.0.0",
    "pytest>=9.0.2",
    "mypy>=1.19.1",
    "ruff>=0.15.0",
    "cupy-cuda12x>=13.6.0",
    "dask>=2026.1.2",
    "pomegranate>=1.1.2",
    "pytest-asyncio>=1.3.0",
    "openai>=2.21.0",
    "flask>=3.1.2",
    "boto3>=1.42.49",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.0.0",
    "pandas-stubs>=2.0.0",
    "types-psutil",
]

[tool.setuptools]
packages = {find = {exclude = ["tests*", "venv*", "artifacts*", "*.egg-info*"]}}

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E402",  # module level import not at top of file (intentional for Windows stdio setup)
]

[tool.ruff.lint.per-file-ignores]
"modules/common/ui/formatting.py" = ["F811"]  # function redefinition for backward compatibility
"main_gemini_chart_batch_scanner_forex.py" = ["F811"]  # setup_windows_stdin redefinition
"modules/auto_trade/**/*.py" = ["E501"]  # line length relaxed; tighten later

# Pytest: run with project venv to avoid wrong interpreter (e.g. .venv\Scripts\python -m pytest or run_tests.bat / run_tests.ps1)
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.pyright]
# Stub for atc_rust (Rust extension) lives in adaptive_trend_LTS
stubPath = "modules/adaptive_trend_LTS"

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["ccxt", "ccxt.pro", "numba", "sklearn.*", "joblib", "cupy", "pandas", "numpy", "customtkinter", "yaml", "atc_rust", "colorama", "psutil"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["google", "google.*", "google.genai", "google.generativeai"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "gui",
    "gui.*",
    "utils",
    "utils.*",
    "database",
    "database.*",
    "execution",
    "execution.*",
]
ignore_missing_imports = true

# ORM instance attribute assignment: mypy treats model.attr = value as assigning to Column, not instance
[[tool.mypy.overrides]]
module = ["modules.auto_trade.database.queries.signals", "modules.auto_trade.database.queries.martingale", "modules.auto_trade.database.queries.gradual_recovery"]
disable_error_code = ["assignment", "arg-type"]

# Script imports colorama; suppress missing-stubs error (or install types-colorama)
[[tool.mypy.overrides]]
module = "modules.auto_trade.test_backtest_phase6"
disable_error_code = ["import-untyped"]

# Coverage for modules/auto_trade — target 90%+ (REFACTORING_RECOMMENDATIONS Day 4)
[tool.coverage.run]
source = ["modules/auto_trade"]
omit = [
    "*/tests/*",
    "*__pycache__*",
    "*/conftest.py",
    "*/test_*.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
]

