# Standard Batch Scan Configuration Template
# This file can be used as a starting point for your custom scans.
# Place this file in the project root to have it detected by the scanner.

# ============================================================================
# GENERAL SETTINGS
# ============================================================================

analysis_mode: multi-timeframe # 'single-timeframe' or 'multi-timeframe'
timeframe: 15m # Used for single-timeframe mode
timeframes: # Used for multi-timeframe mode
  - 15m
  - 1h
  - 4h

cooldown: 2.5 # Range: 0.1-60.0 seconds (recommended: 1.0-5.0 to avoid rate limits)
limit: 700 # Number of candles per symbol

# ============================================================================
# MARKET COVERAGE (Symbol Selection)
# ============================================================================

max_symbols:
  null # null = scan ALL symbols (no limit)
  # The maximum number of symbols to include in a scan.
  # If set to null, all available symbols will be scanned.
  # Use this to limit the scan scope for performance or focus.

# ============================================================================
# STAGE 0 SAMPLING CONFIGURATION
# ============================================================================

stage0_sample_percentage:
  10 # Range: 1-100 (100 = no sampling)
  # The percentage of the market to select in Stage 0 sampling.
  # 100 means sample all symbols (no sampling applied).
  # Reduce this to scan a subset of symbols.

stage0_sampling_strategy:
  stratified # Sampling strategy to use
  # Available strategies:
  # - 'random': Pure random sampling (uniform probability)
  # - 'volume_weighted': Higher volume symbols have higher probability
  # - 'stratified': Divide into volume tiers, sample evenly from each (RECOMMENDED)
  # - 'top_n_hybrid': Top N% by volume + random for rest
  # - 'systematic': Every n-th symbol from volume-sorted list
  # - 'liquidity_weighted': Combines volume/volatility/spread (advanced)

# Strategy-specific parameters (only used by certain strategies)
stage0_stratified_strata_count: 3 # Number of strata for stratified sampling (default: 3 for top/mid/low)
stage0_hybrid_top_percentage: 50.0 # For top_n_hybrid: % of sample from top volume (default: 50%)

# ============================================================================
# PRE-FILTER CONFIGURATION
# ============================================================================

enable_pre_filter: true
pre_filter_mode: voting # 'voting' or 'hybrid'
pre_filter_percentage: 30.0 # Top % to select after filtering
pre_filter_auto_skip_threshold: 10 # Auto-skip percentage filter if Stage 3 returns fewer symbols than this

# Fast Mode Configuration
# Fast Mode (fast_mode: true) - RECOMMENDED:
#   Uses 3-stage sequential filtering for optimal performance:
#   - Stage 1: ATC scan only → keeps 100% of symbols that pass
#   - Stage 2: ATC + Range Oscillator + SPC → voting → keeps 100% that pass
#   - Stage 3: ATC + XGBoost + HMM + RF (ML models) → voting → keeps 100% that pass
#   Benefits: Much faster because ML models (XGBoost, HMM, RF) are only calculated
#             for symbols that already passed Stage 1 and 2 filtering.
#   Use case: Large market scans, frequent updates, production environments.
#
# Full Mode (fast_mode: false) - SLOW:
#   Calculates ALL indicators (ATC, Range Osc, SPC, XGBoost, HMM, RF) for ALL symbols
#   from the start, regardless of early filtering results.
#   Benefits: More thorough analysis, all indicators available for every symbol.
#   Use case: Small symbol sets, detailed analysis, research/backtesting.
#
# Note: Even in Fast Mode, Stage 3 still calculates all ML models (ignores fast_mode flag
#       for Stage 3) but only for symbols that passed Stage 2, making it much faster.
pre_filter_fast_mode: true # Sequential 3-stage filtering

# ============================================================================
# SPC (SIMPLIFIED PERCENTILE CLUSTERING) CONFIGURATION
# ============================================================================

spc_config:
  # preset: aggressive # 'conservative', 'balanced', 'aggressive', or null

  # Advanced parameters
  # ⚠️ WARNING: These parameters are IGNORED when preset is set. To use these, set preset: null
  volatility_adjustment: false
  use_correlation_weights: false
  time_decay_factor: 1.0
  interpolation_mode: linear
  min_flip_duration: 3
  flip_confidence_threshold: 0.6

  # Multi-timeframe SPC alignment
  # Enable multi-timeframe analysis for SPC signals. When enabled, the system
  # will check signal alignment across multiple timeframes to increase confidence.
  # This helps filter out false signals that only appear on a single timeframe.
  enable_mtf: true

  # List of timeframes to check for signal alignment. Signals must align across
  # these timeframes (if mtf_require_alignment is true) or show consistency
  # across them. Common combinations: ['1h', '4h'] or ['15m', '1h', '4h']
  mtf_timeframes:
    - 15m
    - 1h
    - 4h

  # If true, signals must align across ALL specified timeframes to be considered valid.
  # If false, signals are weighted by alignment percentage (more aligned = higher confidence).
  # Recommended: true for conservative filtering, false for more signal opportunities.
  mtf_require_alignment: true

# ============================================================================
# RANDOM FOREST CONFIGURATION
# ============================================================================
# Note: Model status and retrained flag are managed automatically by the system
# and do not need to be configured manually.

rf_training:
  # Force retraining even if model is valid
  # If true, the scanner will force a retrain before starting the scan.
  force_retrain: true

  auto_train_if_invalid: true
  training_symbols_mode: "auto" # 'auto' or 'manual'
  training_symbols_count: 10 # For auto mode
  manual_symbols: [] # For manual mode
  training_timeframe: "15m"
  training_limit: 1500

# ============================================================================
# ATC (ADAPTIVE TREND COMPONENT) CONFIGURATION
# ============================================================================
# For detailed optimization guide, see: modules/adaptive_trend_LTS/docs/setting_guides_speed_optimization.md

# ATC Core Parameters (for signal calculation)
atc_core:
  # Moving Average lengths (default: 28 for all)
  ema_len: 28
  hull_len: 28
  wma_len: 28
  dema_len: 28
  lsma_len: 28
  kama_len: 28

  # Moving Average initial weights (default: 1.0 for all)
  ema_w: 1.0
  hma_w: 1.0
  wma_w: 1.0
  dema_w: 1.0
  lsma_w: 1.0
  kama_w: 1.0

  # ATC algorithm parameters
  robustness: "Medium" # "Narrow", "Medium", or "Wide" - sensitivity level
  lambda_param: 0.02 # Growth rate - 0.02 = balanced (lower = conservative, higher = aggressive)
  decay: 0.03 # Decay rate - 0.03 = balanced (lower = slower decay, higher = faster reset)
  cutout: 0 # Number of bars to skip at beginning (for backtesting: set to 20-50 to skip warm-up period)

  # Signal thresholds
  long_threshold: 0.1 # Threshold for LONG signal classification
  short_threshold: -0.1 # Threshold for SHORT signal classification

  # Backtesting Configuration ⚠️ IMPORTANT FOR BACKTESTING
  strategy_mode:
    false # Set TRUE for backtesting to avoid look-ahead bias (shifts signal by 1 bar)
    # - false: Signal uses current bar (for live trading/scanning)
    # - true: Signal uses previous bar (for backtesting - prevents look-ahead)
    # RECOMMENDED: true for backtesting, false for live trading

# Switch between ATC versions:
# - true: use 'modules/adaptive_trend_LTS' (High Performance - Rust/CUDA/Dask)
# - false: use 'modules/adaptive_trend' (Standard/Legacy)
use_atc_performance: true

atc_performance:
  # Preset 3: Medium Batch Scanning (100-1000 symbols) - GPU Accelerated
  # preset: "medium_batch_gpu" # Options: "small", "medium_batch_gpu", "large_dask", "custom"
  # If preset is not "custom", preset overrides individual settings below

  batch_processing: false # CUDA handles batching (set false when using CUDA)
  use_cuda: true
  # NOTE: If use_cuda=true, you MUST set: batch_processing=false, parallel_l1=false, parallel_l2=false

  parallel_l1: false # CUDA handles parallelism (set false when using CUDA)
  parallel_l2: false # CUDA handles parallelism (set false when using CUDA)
  prefer_gpu: true # Auto-select GPU if available
  use_cache: true # Cache intermediate results
  disable_ml_models: true # Disable XGBoost/HMM in early stages (renamed from fast_mode)
  precision: "float32" # Options: "float32" (fast) or "float64" (accurate)

  # Dask (Out-of-Core) Configuration
  use_dask: false # Auto-enabled by system if symbols > 1000
  npartitions: null # null = auto-calculate based on dataset size

  # Incremental Updates (for live trading - NOT for backtesting)
  use_incremental:
    false # Set true for live trading (10-100x faster for single bar updates)
    # ⚠️ NOT RECOMMENDED FOR BACKTESTING: Use full recalculation for accuracy

  # Memory Optimizations (for backtesting large datasets)
  use_memory_mapped:
    false # Set true for very large backtesting datasets (>10GB)
    # Enables 90% memory reduction by using memory-mapped files
    # RECOMMENDED FOR BACKTESTING: true when dataset exceeds RAM
  use_compression:
    false # Set true to reduce cache storage (5-10x smaller cache files)
    # RECOMMENDED FOR BACKTESTING: true to save disk space
  compression_level:
    5 # Compression level (1-9, default: 5)
    # Higher = better compression but slower (use 5-7 for balance)

  # Advanced Settings
  warm_cache: false # Pre-warm cache for repeated patterns
  use_codegen_specialization: false # Enable JIT for hot path configs

approximate_ma_scanner:
  enabled:
    true # Enable/disable approximate MA calculations (true = 2-3x faster, false = exact MAs)
    # ⚠️ FOR BACKTESTING: Set false for full precision (exact MAs required for accurate results)
    # Use true for scanning/filtering (2-3x faster, ~95% accuracy acceptable)
  use_adaptive: true # Enable adaptive tolerance based on volatility
  num_threads: null # null = auto-detect CPU cores
  volatility_window: 20 # Window size for volatility calculation
  base_tolerance: 0.05 # Base tolerance (5%) for adaptive mode
  volatility_factor: 1.0 # Multiplier for volatility impact on tolerance

# ============================================================================
# XGBOOST LTS CONFIGURATION
# ============================================================================
# For detailed optimization guide, see: modules/xgboost_LTS/docs/setting_guides_speed_optimization.md

# Switch between XGBoost versions:
# - true: use 'modules/xgboost_LTS' (High Performance - Rust/GPU/Cache/Optuna)
# - false: use 'modules/xgboost' (Standard/Legacy)
use_xgboost_performance: true

xgboost_lts:
  # preset: "production_gpu" # Options: "development", "production_gpu", "research", "custom"

  # ──────────────────────────────────────────────────────────────────────────
  # PRESET 5: Production Deployment (GPU + Rust + Cache + Optional Optuna)
  # ──────────────────────────────────────────────────────────────────────────
  # Use Case: Live trading bot, production API, real-time predictions
  # Expected Performance:
  #   - Model loading: <0.1s (cached)
  #   - Live prediction: ~0.5-1s per symbol
  #   - Optional Optuna tuning: 2-8x speedup with parallel trials

  # ──────────────────────────────────────────────────────────────────────────
  # Labeling Parameters
  # ──────────────────────────────────────────────────────────────────────────
  labeling:
    TARGET_HORIZON: 12 # Bars ahead to predict (default: 12)
    TARGET_BASE_THRESHOLD: 0.0008 # Base price change threshold (%) (default: 0.0008)
    XGBOOST_VOLATILITY_ROLLING_WINDOW: 100 # Window for volatility calculation (default: 100)

  # ──────────────────────────────────────────────────────────────────────────
  # Model Parameters (Production-Optimized)
  # ──────────────────────────────────────────────────────────────────────────
  # Note: These are default parameters. For optimal performance, run Optuna
  # hyperparameter tuning (see optuna section below) and use best_params.
  model:
    max_depth: 6 # Maximum tree depth (default: 6)
    learning_rate: 0.01 # Range: 0.001-0.1 (typical: 0.01-0.05)
    n_estimators: 200 # Number of boosting rounds (default: 200)
    min_child_weight: 3 # Minimum sum of instance weight (default: 3)
    gamma: 0.1 # Minimum loss reduction (default: 0.1)
    subsample: 0.8 # Training data subsample ratio (default: 0.8)
    colsample_bytree: 0.8 # Feature subsample ratio per tree (default: 0.8)
    reg_alpha: 0.5 # L1 regularization (default: 0.5)
    reg_lambda: 2.0 # L2 regularization (default: 2.0)
    tree_method: "hist" # Tree construction algorithm (default: "hist")
    device: "auto" # Options: "auto" (detect GPU), "cuda" (force GPU), "cpu" (force CPU)
    early_stopping_rounds: 20 # Early stopping to prevent overfitting (default: 20)

  # ──────────────────────────────────────────────────────────────────────────
  # Cross-Validation Parameters
  # ──────────────────────────────────────────────────────────────────────────
  cross_validation:
    n_splits: 5 # Number of time-series CV folds (default: 5)
    test_size: 500 # Number of bars in test set per fold (default: 500)
    gap: 12 # Gap between train and test to avoid leakage (default: 12, should match TARGET_HORIZON)

  # ──────────────────────────────────────────────────────────────────────────
  # Performance & Optimization
  # ──────────────────────────────────────────────────────────────────────────
  performance:
    XGBOOST_USE_FLOAT32: true # Use float32 for 2x memory reduction (default: true)
    XGBOOST_USE_PARALLEL_CV: true # Enable Parallel CV for faster batch processing (default: true)
    use_rust: true # Enable Rust for feature/labeling (3-5x speedup) (default: true)
    use_cache: true # Enable model & label caching (50-180x for repeated runs) (default: true)
    cache_compression: true # Compress cached files (5-10x reduction) (default: true)
    cache_ttl: 604800 # Cache lifetime in seconds (7 days) (default: 604800)

    # Batch Processing Settings
    batch_processing: true # Enable optimization for multiple symbols
    max_workers: null # null = auto-detect optimal worker count based on CPU cores

  # ──────────────────────────────────────────────────────────────────────────
  # Optuna Hyperparameter Tuning (Optional - Run once before deployment)
  # ──────────────────────────────────────────────────────────────────────────
  # Workflow:
  #   1. Run Optuna optimization once (when deploying or periodically)
  #   2. Get best_params from optimization
  #   3. Train production model with best_params
  #   4. Cache the model for fast loading
  #
  # Performance: 2-8x speedup with OPTUNA_PARALLEL_TRIALS=-1 (uses all CPU cores)
  optuna:
    enabled:
      false # Enable Optuna hyperparameter tuning (default: false)
      # Set to true to run optimization before deployment
      # After getting best_params, set to false and use those params

    OPTUNA_PARALLEL_TRIALS:
      -1 # Parallel Optuna trials (-1 = use all CPU cores) (default: -1)
      # Expected speedup: 2-8x depending on CPU cores

    n_trials:
      50 # Number of trials for optimization (default: 50)
      # Fewer trials for production tuning (vs 100+ for research)
      # 50 trials usually sufficient for good params

    n_splits_optuna:
      3 # CV splits for Optuna (default: 3)
      # Use fewer splits (3) for faster optimization
      # Final model will use n_splits from cross_validation section

    # Search space for hyperparameters (Optuna will search within these ranges)
    search_space:
      max_depth: [4, 5, 6, 7, 8] # Tree depth options
      learning_rate: [0.005, 0.01, 0.02, 0.05] # Learning rate options
      n_estimators: [100, 150, 200, 300] # Number of trees options
      min_child_weight: [1, 3, 5] # Min child weight options
      gamma: [0, 0.1, 0.2] # Gamma options
      subsample: [0.7, 0.8, 0.9, 1.0] # Subsample ratio options
      colsample_bytree: [0.7, 0.8, 0.9, 1.0] # Column subsample options


  # ──────────────────────────────────────────────────────────────────────────
  # Production Deployment Workflow
  # ──────────────────────────────────────────────────────────────────────────
  # Step 1: (Optional) Run Optuna optimization
  #   - Set optuna.enabled = true
  #   - Run scanner once to get best_params
  #   - Note down best_params from output
  #
  # Step 2: Update model parameters with best_params
  #   - Copy best_params to model section above
  #   - Set optuna.enabled = false
  #
  # Step 3: Train production model
  #   - Run scanner with use_cache = true
  #   - Model will be cached for fast loading
  #
  # Step 4: Live trading
  #   - Cached model loads in <0.1s
  #   - Predictions take ~0.5-1s per symbol
  #   - Re-run Optuna periodically (weekly/monthly) to adapt to market changes
