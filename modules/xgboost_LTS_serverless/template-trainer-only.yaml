AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: XGBoost Serverless Trainer Service Only

Parameters:
  ModelBucketName:
    Type: String
    Description: S3 bucket name used to store XGBoost models
    Default: ""
  BinanceApiKey:
    Type: String
    Description: Binance API key
    Default: ""
    NoEcho: true
  BinanceApiSecret:
    Type: String
    Description: Binance API secret
    Default: ""
    NoEcho: true

Conditions:
  UseProvidedModelBucketName: !Not [!Equals [!Ref ModelBucketName, ""]]

Resources:
  XGBoostTrainerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: xgboost-trainer
      PackageType: Image
      ImageUri: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/xgboost-trainer:latest"
      MemorySize: 3008
      Timeout: 900
      EphemeralStorage:
        Size: 1024
      Policies:
        - S3FullAccessPolicy:
            BucketName: !Ref ModelBucket
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: "*"
      Environment:
        Variables:
          MODEL_BUCKET: !Ref ModelBucket
          NUMBA_CACHE_DIR: /tmp
          BINANCE_API_KEY: !Ref BinanceApiKey
          BINANCE_API_SECRET: !Ref BinanceApiSecret

  ModelBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !If
        - UseProvidedModelBucketName
        - !Ref ModelBucketName
        - !Sub "${AWS::StackName}-models-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled

  PredictionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-predictions"
      VisibilityTimeout: 300
      MessageRetentionPeriod: 86400

Outputs:
  ModelBucketName:
    Description: S3 bucket for model storage
    Value: !Ref ModelBucket

  PredictionQueueUrl:
    Description: SQS queue for predictions
    Value: !Ref PredictionQueue

  TrainerFunctionName:
    Description: XGBoost Trainer Lambda function name
    Value: !Ref XGBoostTrainerFunction

  TrainerFunctionArn:
    Description: XGBoost Trainer Lambda ARN
    Value: !GetAtt XGBoostTrainerFunction.Arn
