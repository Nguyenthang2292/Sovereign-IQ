[package]
name = "xgboost_lambda"
version = "0.1.0"
edition = "2021"

[dependencies]
xgboost_serverless = { path = "../" }
lambda_runtime = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
aws-config = "1.0"
aws-sdk-s3 = "1.0"
aws-sdk-sqs = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simd-json = { version = "0.13", features = ["serde_impl"] }
anyhow = "1.0"


[[bin]]
name = "bootstrap"
path = "src/main.rs"
