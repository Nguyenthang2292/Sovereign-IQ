AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ATC Serverless Lambda function template

Resources:
  ATCServerlessFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: bootstrap
      PackageType: Zip
      Runtime: provided.al2
      Architectures:
        - x86_64
      MemorySize: 1769
      Timeout: 120
      Tracing: Active
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSXrayWriteOnlyAccess
      Environment:
        Variables:
          RUST_LOG: info
          AWS_REGION: us-east-1

  WarningAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: atc-lambda-alerts

  CriticalAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: atc-lambda-critical-alerts

  PerformanceAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: atc-lambda-performance-alerts

  ErrorAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: atc-lambda-error-alerts

  MemoryWarningAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ATC-Lambda-MemoryWarning
      AlarmDescription: Memory usage exceeds 1200MB threshold
      Namespace: ATC/Serverless
      MetricName: MemoryUsageMB
      Dimensions:
        - Name: FunctionName
          Value: !Ref ATCServerlessFunction
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1200
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref WarningAlertsTopic

  MemoryCriticalAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ATC-Lambda-MemoryCritical
      AlarmDescription: CRITICAL memory usage exceeds 1500MB threshold
      Namespace: ATC/Serverless
      MetricName: MemoryUsageMB
      Dimensions:
        - Name: FunctionName
          Value: !Ref ATCServerlessFunction
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1500
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref CriticalAlertsTopic

  LowThroughputAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ATC-Lambda-LowThroughput
      AlarmDescription: Processing throughput below 1000 symbols/second
      Namespace: ATC/Serverless
      MetricName: SymbolsPerSecond
      Dimensions:
        - Name: FunctionName
          Value: !Ref ATCServerlessFunction
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1000
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref PerformanceAlertsTopic

  HighErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ATC-Lambda-HighErrorRate
      AlarmDescription: Error rate exceeds 10% of processed symbols
      Namespace: ATC/Serverless
      MetricName: ErrorRate
      Dimensions:
        - Name: FunctionName
          Value: !Ref ATCServerlessFunction
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref ErrorAlertsTopic
