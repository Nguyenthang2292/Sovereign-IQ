[workspace]
members = [".", "lambda"]

[package]
name = "atc_serverless"
version = "0.2.0"
edition = "2021"
description = "Serverless Adaptive Trend Classification module"

[dependencies]
ndarray = "0.15"
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = { version = "1.13", features = ["const_generics", "union"] }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
proptest = "1.4"

[features]
default = []
simd = []  # Use std::simd from Rust standard library (nightly only)

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
debug = false

[profile.release-debug]
inherits = "release"
debug = true

[[bin]]
name = "atc_benchmark"
path = "src/bin/benchmark.rs"
