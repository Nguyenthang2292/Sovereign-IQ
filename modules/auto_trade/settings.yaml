  scan_interval: 5
  timeframe: 15m
  symbol_list: Top 20
  auto_start: true
  retrain_xgboost: true
  running: false
  sampling_strategy: volume_weighted
  sample_percentage: 50
ui:
  theme: dark
  font_size: 12
  window_size:
    width: 1200
    height: 800
  last_active_tab: Dashboard
  column_visibility: {}
  widget_order: {}
recovery:
  initial_loss: 0.0
  target_profit_per_trade: 8.0
  max_recovery_trades: 13
  margin_scaling_mode: adaptive
  leverage_scaling_mode: adaptive
  min_leverage: 5
  max_leverage: 15
  enable_streak_bonus: true
trading:
  default_position_size: 100.0
  default_leverage: 2
