risk:
  max_position_size: 100.0
  max_open_positions: 3
  max_daily_loss: 90.0
  default_leverage: 3x
filters:
  min_signal_score: 0.18999999999999995
  enable_xgboost: true
  atc_threshold: 0.21999999999999997
  symbol_whitelist: 'BTC/USDT

    ETH/USDT

    SOL/USDT

    '
  min_volume: 50.0
api:
  exchange: Binance
  mode: PRODUCTION
tp_sl:
  default_tp: 5.0
  default_sl: 2.5
  trailing_stop: false
  mode: Percentage
