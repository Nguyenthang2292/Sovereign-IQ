[package]
name = "regime_lambda"
version = "0.1.0"
edition = "2021"

[lib]
name = "regime_lambda_lib"
path = "src/lib.rs"

[[bin]]
name = "regime_lambda"
path = "src/main.rs"

[dependencies]
lambda_http = "0.14"
lambda_runtime = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
