[package]
name = "sovereign_prime"
version = "0.1.0"
edition = "2021"

[lib]
name = "sovereign_prime"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23.3", features = ["extension-module"] }
numpy = "0.23.0"
ndarray = "0.16"
rayon = "1.8"
ordered-float = "4.2"

[profile.release]
# Enable optimizations for SIMD auto-vectorization
opt-level = 3
lto = "thin"
codegen-units = 1
