[pytest]
# Run pytest using the project venv so the correct interpreter is used:
#   Windows:  run_tests.bat  or  run_tests.ps1  or  .venv\Scripts\python -m pytest
#   Unix:     .venv/bin/python -m pytest  (or activate then: python -m pytest)
# The scripts run_tests.bat / run_tests.ps1 activate .venv and run pytest automatically.

# Default options for pytest
# --capture=no avoids "I/O operation on closed file" teardown bug on Python 3.12+/3.13 (Windows)
# --color=no avoids TerminalWriter+colorama closed-file error during collection on Windows
addopts =
    -v
    --tb=short
    --capture=no
    --strict-markers
    --durations=10
    # -n auto
    # --dist loadscope
    --maxfail=5
    --color=no
    --code-highlight=no

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    memory_intensive: marks tests that use significant RAM
    integration: marks tests as integration tests
    performance: marks tests that measure performance
    benchmark: marks benchmark tests (requires pytest-benchmark to run)
    unit: marks tests as unit tests
    gpu: marks tests that require GPU/CUDA
    asyncio: marks tests as asyncio tests

# Filtering
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore:.*The given NumPy array is not writable.*:UserWarning

# Environment variables
# Ensures Python can find project modules
env =
    PYTHONPATH=.
    PYTEST_RUNNING=1

# Virtual environment: use .venv to avoid interpreter mix (e.g. ServBay vs venv).
# Recommended: run_tests.bat or run_tests.ps1 (they use .venv automatically).
# Or: .venv\Scripts\python -m pytest  (Windows),  .venv/bin/python -m pytest  (Unix)
